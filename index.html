<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet" />
    <title>Tea House</title>
    <link href="./output.css" rel="stylesheet" />
  </head>
  <body class="text-dark-3">
    <main class="max-w-6xl mx-auto px-3 lg:px-5">
      <!-- Hero Section -->
      <section
        class="flex flex-wrap-reverse gap-3 sm:gap-0 sm:flex-nowrap py-14 justify-between">
        <!-- Hero Content -->
        <div class="flex flex-col gap-5 text-center sm:text-left">
          <h1 class="heading-primary">
            It's good <br class="hidden sm:block" />
            tea time at The <br class="hidden sm:block" />
            Tea House
          </h1>
          <p class="text-lg">
            Tea and Botanical Solutions Supplier Give Optimum
            <br class="hidden xl:block" />
            Satisfaction To Your Taste Buds.
          </p>
          <a
            href="#"
            class="flex items-center self-start px-6 justify-center gap-1.5 text-xl font-bold text-white bg-gradient-to-r from-grad-1 to-grad-2 py-2 rounded-md mx-auto sm:mx-0"
            >Explore More

            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-4 mt-1">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25" />
            </svg>
          </a>
        </div>
        <!-- Hero Image -->
        <div class="relative sm:self-end lg:self-auto xl:basis-1/2">
          <figure>
            <img src="./src/images/banner.png" alt="Hero Image" />
          </figure>
          <div
            class="flex gap-1 items-center shadow-md px-4 py-2 w-max rounded-md absolute bottom-5 sm:bottom-4 left-1/2 -translate-x-3/5 sm:left-7.5 sm:-translate-x-0 lg:bottom-6 lg:left-[5.625rem] bg-white">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="#fcc419"
              class="size-10">
              <path
                fill-rule="evenodd"
                d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z"
                clip-rule="evenodd" />
            </svg>

            <div>
              <p class="font-bold text-2xl text-dark-1">5.00</p>
              <p>Trust Pilot Ratings</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
